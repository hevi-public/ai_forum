server:
  # Bind to loopback only: this is a single-user local tool with no auth, so it must not be reachable
  # from the LAN. (T2.1 — turns the "binds 0.0.0.0 / no auth" Critical into a non-issue; full auth
  # stays deferred to T3.1.) Keeps the default port 8080 — only the bind address is constrained. The
  # test profile is left untouched (its RANDOM_PORT / TestRestTemplate already use loopback).
  address: 127.0.0.1

spring:
  datasource:
    # Persistent home-directory DB for long-term work (dev uses a throwaway project-local file).
    # ${user.home} is resolved by Spring to an absolute path before xerial/the DataDirectoryInitializer
    # see it, so the SQLite driver never receives a literal `~` (which it would NOT expand). The
    # initializer also hardens against a literal `~` as a backstop.
    url: jdbc:sqlite:${user.home}/.ai_forum/data/aiforum.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
  # Static assets (app.css, app.js, *.mjs) carry no fingerprint in their URLs, so a renamed CSS class
  # or changed script would otherwise be styled/run against a browser-cached copy until heuristic
  # freshness expires. no-cache forces the browser to revalidate every fetch; the existing Last-Modified
  # header then yields a cheap 304 when nothing changed and fresh bytes the instant it does. (Mirrors
  # application-dev.yml. If a fingerprinting/CDN strategy lands later, swap this for long-lived caching.)
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

aiforum:
  backups:
    enabled: true
    # Persistent home-directory snapshots, sibling of the prod DB. Pinned explicitly (rather than relying
    # on the SqliteBackup @Value defaults) so the prod backup target is legible here. ${user.home} is
    # Spring-resolved before the path is read, so no literal ~ reaches the filesystem.
    dir: ${user.home}/.ai_forum/backup
    keep: 7
  llm:
    # Personas reach the network in prod too.
    # ⚠ SECURITY: the Docker jail (requirements §12, plan_docs/llm-sandbox.md) now EXISTS but is OFF by
    # default — see the jail: block below. While it is off, prod personas fetch from the HOST directly with
    # no isolation, and a blank allowlist here = ANY host. Web content is untrusted (prompt-injection risk).
    # Until the jail is switched on, scope web-fetch-allowed-domains to trusted hosts, e.g.
    # "news.ycombinator.com,github.com". See requirements §12 (status note) for the full caveat.
    web-fetch-enabled: true
    web-fetch-allowed-domains: ""   # ← blank = any host; tighten this in prod
    # Read-only GitHub tools for personas (Option B): the in-repo gh-readonly MCP so a persona reviewing a
    # PR thread can pull the FULL pull request + diff (the opening post embeds only a truncated excerpt).
    # Inline MCP config so it's path-portable (${user.dir}=launch cwd, Spring-resolved like ${user.home}).
    # Needs `gh` authed + `node` on PATH. ⚠ SECURITY: same untrusted-input caveat as web-fetch above — the
    # gh tools can reach any repo; tighten or disable if that surface matters.
    github-tools-enabled: true
    github-mcp-config: '{"mcpServers":{"gh-readonly":{"command":"node","args":["${user.dir}/mcp/gh-readonly/server.mjs"]}}}'
    # The Docker jail (§12, plan_docs/llm-sandbox.md) — the isolation the two caveats above kept deferring
    # to. Built, opt-in, off by default. Enabling it in prod is the recommended posture once the image is
    # built and `./gradlew jailContract` is green on the host; steps in the README ("Sandboxing the persona
    # subprocess") and plan_docs/llm-sandbox.md §10. On a Keychain-based macOS host it needs
    # `claude setup-token` + CLAUDE_CODE_OAUTH_TOKEN exported in the app's environment.
    # ⚠ With the jail ON, deny-by-default egress applies: every WebFetch host and every article/feed host a
    # persona should reach must ALSO be in aiforum.llm.jail.egress-allowlist, or the fetch is denied. (Feed
    # COLLECTION itself is unaffected — it runs in-JVM on the host and is not jailed.)
    jail:
      enabled: false
  github:
    enabled: true
