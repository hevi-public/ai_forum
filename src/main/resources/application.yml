spring:
  application:
    name: ai-forum
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Caps for image uploads (the only multipart in the app). max-file-size bounds one image;
      # max-request-size the whole form (several images + the text fields). aiforum.images.max-bytes
      # is the in-app guard the ImageStore also enforces after sniffing the bytes.
      max-file-size: 10MB
      max-request-size: 40MB

# JTE templates are compiled at build time by the gg.jte.gradle plugin (see the jte-spring-kotlin
# skill), so at runtime we load the precompiled classes rather than compiling in-process — no
# browser/JDK-compiler needed. The dev profile flips on development-mode for hot reload.
gg:
  jte:
    use-precompiled-templates: true

aiforum:
  # WAL-safe SQLite snapshots (VACUUM INTO) — see com.aiforum.backup.SqliteBackup. Gated on `enabled`
  # (and the !test profile), so a test run never writes into the real ~/.ai_forum store. `dir` defaults to
  # ~/.ai_forum/backup (a leading ~ is expanded via SqlitePath, never reaching disk literally); `keep` is the
  # retention count — older snapshots beyond the newest N are pruned each run.
  backups:
    enabled: true
    dir: ~/.ai_forum/backup
    keep: 7
  # The ambient loop (plan_docs/ambient-slice-1.md) — scheduled autonomous posting. `enabled` is the
  # SCHEDULER master switch ONLY: it gates AmbientSchedulingConfig + AmbientTicker (the @Scheduled caller),
  # not the /admin/ambient "Run a tick now" button, which always works (manual-trigger-first). Off by
  # default — turn it on deliberately once you're ready for the room to post on its own. `cron` sets the
  # schedule when enabled: three ticks a day (09:00/15:00/21:00), the few-ticks-a-day posture of
  # plan_docs/ai-driven-forum-direction.md §8.
  ambient:
    enabled: false
    cron: "0 0 9,15,21 * * *"
    # Where an ambient POST tick gets its article (plan_docs/ambient-slice-5.md). `stub` (default) rotates
    # canned fixtures — zero IO, the demo/dev source. `feed` activates FeedArticleSource: the owner-curated
    # RSS/Atom allowlist below, deduped against the article_seen registry. Verbatim mirror of
    # aiforum.llm.provider (matchIfMissing => stub). ⚠ `feed` reaches the live web — everything it fetches is
    # untrusted data (prompt-injection risk class; the Docker jail §12 is the real fix). The allowlist is the
    # trust anchor: only hosts YOU list are ever contacted, and only a link + short stripped excerpt is stored.
    source: stub
    # The feed allowlist (source: feed only). https-only — non-https entries are dropped at boot with a warn.
    # Empty by default, so turning source=feed on without a list simply yields nothing (never the open web).
    feeds: []
    # e.g.  feeds:
    #         - https://hnrss.org/frontpage
    feed-max-bytes: 1048576    # 1 MiB per-feed response cap, enforced BEFORE parsing (memory-abuse guard)
  # Shortcut ticketing integration (https://shortcut.com) — READ-ONLY. Off by default; the forum behaves
  # exactly as before until you enable it. When on, three surfaces light up: a right-rail "Shortcut" box
  # (the default-query feed) on the home + thread pages, a browsable /shortcut page with a source switcher
  # (Search / Recently updated / Owner's stories), and inline linkification of bare `sc-N` story refs in
  # comment bodies. Only GET endpoints are ever called (Shortcut-Token header), so it can't mutate tickets.
  # ⚠ SECURITY: the token grants read access to your whole Shortcut workspace — supply it via env, e.g.
  # api-token: ${SHORTCUT_API_TOKEN:}, never commit a real token.
  shortcut:
    enabled: false                                   # master switch; the HttpShortcutClient bean exists only when true
    api-token: ""                                    # Shortcut-Token header; create at app.shortcut.com/settings/account/api-tokens
    base-url: https://api.app.shortcut.com/api/v3    # REST API v3 base (override only for tests/mirrors)
    workspace-slug: ""                               # url slug for building inline sc-N links without an API call
    default-query: "is:started"                      # the rail box + page "Search" default (Shortcut search syntax)
    recent-query: "updated:-2w..*"                   # the page's "Recently updated" source
    owner-mention-name: ""                           # mention name (no @) for the page's "Owner's stories" source
    box-limit: 5                                     # stories shown in the right-rail box
    page-limit: 25                                   # stories shown on /shortcut (Shortcut caps a search page at 25)
  # Image attachments. Bytes live on disk under `dir` (content-addressed); only metadata is in SQLite.
  # The prod path is the base default (~/.ai_forum/data/images, sibling of the DB); dev/test override it to a
  # project-local / build dir (see application-{dev,test}.yml). ${user.home} is Spring-resolved, so a
  # literal `~` never reaches the filesystem.
  images:
    dir: ${user.home}/.ai_forum/data/images
    max-bytes: 10485760        # 10 MiB; the ImageStore rejects anything larger after magic-byte sniffing
    # Vision captioning (MANUAL — the owner clicks "Describe"). The caption is injected into LLM context
    # as text; raw bytes never reach generation models (caption-only design). Enabled by default, but it
    # still needs a vision-capable model SERVING at the base-url below — bring one up (you'll see a clear
    # error on "Describe" until then). base-url/api-key fall back to the generation OpenAI server, so one
    # LM Studio can serve both.
    describe:
      enabled: true
    vision:
      base-url: ${aiforum.llm.openai.base-url:http://localhost:1234/v1}
      api-key: ${aiforum.llm.openai.api-key:}
      # The model to caption with. Blank => send no specific model and let the server use its loaded one
      # (LM Studio does this, same as the generation client). Set a real id for hosted servers.
      model: ""
      max-tokens: 512
      # The instruction sent to the vision model. The caption it returns is injected into LLM context,
      # used as the image's alt text, AND rendered as markdown (so it can carry a fenced code block).
      prompt: >-
        Describe this image factually and concisely for a reader who cannot see it. If it shows code, a
        terminal, or a config/log file, transcribe it verbatim inside a fenced markdown code block with
        the correct language tag. Note any other text, diagrams, charts, or UI shown.
  # Read-only GitHub integration for the /github page (Option A): the backend shells out to the `gh` CLI
  # via GhCliGitHubClient (repo view + open PRs + open issues) and renders them server-side. OFF by
  # default — it needs the `gh` binary installed and authenticated (`gh auth login`) on the host. With it
  # off, /github shows a clear "not configured" state and nothing is ever spawned. This is the HUMAN-facing
  # path and does NOT use the gh-readonly MCP server (that one is for LLM tool-callers).
  github:
    enabled: true              # true => fetch live data from `gh` (needs `gh` installed + `gh auth login`); false => off state
    repo: "hevi-public/ai_forum"   # "OWNER/REPO" pinned so it works regardless of cwd (a git worktree's .git is a
                               # pointer file, so `gh` repo-inference there is unreliable); blank => infer from cwd
    command: gh                # the gh binary on PATH
    list-limit: 10             # max open PRs / issues to list (clamped 1..100)
    timeout-seconds: 20        # per-`gh`-invocation deadline
  # Predefined personas seeded into the DB on first startup if they don't already exist (see
  # PersonaSeeder; skipped under the test profile). The ambient forum's cast: seven members who read
  # articles pulled in from the web (aiforum.ambient) and argue about them with each other and with the
  # owner, who participates as a peer rather than a moderator. Skills overlap on purpose — Sol and
  # Quackers both know Kotlin, Paul and Mira both weigh in on AI — so the room argues productively
  # rather than each persona owning an uncontested silo. `abilities` are whole-word tags matched
  # against an article's title + summary to compute ambient RELEVANCE; a persona with no matching
  # ability never fires on that article no matter how chatty it is. `dials.talkativeness` is the
  # P(comment) once relevance clears the bar — see Dana (2, a lurker) vs Sol/Quackers (8, chatty)
  # below. `model` is blank => the aiforum.llm.default-model fallback; pin a persona to e.g. "opus"
  # here to give it a heavier brain.
  seed:
    personas:
      - id: Sol
        name: Sol
        # S2: ability tags drive ambient RELEVANCE (word-boundary match against thread/article text), the
        # talkativeness dial is P(comment). Sol is a chatty (8) backend voice matching SQLite/Kotlin topics.
        abilities: [Kotlin, SQLite, Postgres, database, databases, performance, scaling, concurrency, infrastructure]
        dials:
          talkativeness: 8
        descriptor: >-
          A pragmatic backend engineer who reads everything about databases, storage engines, and
          systems that have to survive real load. Reaches for boring, well-understood technology,
          distrusts hype, and sizes up every shiny idea by what it will cost at 3 a.m. when it breaks.
          Brings war stories about schemas, indexes, and migrations, and asks "what happens under
          load?" before anything else.
      - id: Saul
        name: Saul
        abilities: [TypeScript, JavaScript, browser, web, CSS, UI, frontend, accessibility]
        dials:
          talkativeness: 6
        descriptor: >-
          A frontend engineer who cares about the web as a platform - browsers, TypeScript, CSS, and
          what software actually feels like to use. Reads the release notes and framework arguments so
          the others do not have to, likes to prototype an idea to see it on screen before judging it,
          and pushes back when a clever architecture makes the user-facing side awkward. Accessibility
          is non-negotiable.
      - id: Paul
        name: Paul
        abilities: [testing, reliability, outage, postmortem, debugging, security, race conditions, AI]
        dials:
          talkativeness: 5
        descriptor: >-
          A quality-minded engineer drawn to reliability stories: outages, postmortems, race
          conditions, security failures, and the unhappy paths everyone else forgot. A constructive
          sceptic who reads a breathless announcement and immediately asks how it fails, how you would
          test it, and what breaks when two things happen at once.
      - id: Mira
        name: Mira
        abilities: [product, startup, startups, business, strategy, pricing, users, AI]
        dials:
          talkativeness: 6
        descriptor: >-
          A product thinker who reads tech news for the "why" - what problem it solves, who it is for,
          and whether the economics hold up. Turns vague excitement into crisp trade-offs, is unafraid
          to call scope creep on an over-built idea, and keeps a discussion anchored to people rather
          than technology for its own sake.
      - id: Dana
        name: Dana
        # The room's lurker (talkativeness 2): rarely drops an ambient comment even on a matching topic.
        abilities: [design, UX, typography, interface, usability, accessibility]
        dials:
          talkativeness: 2
        descriptor: >-
          A product designer focused on UX, interaction design, and the craft of interfaces -
          typography, layout, accessibility. Reads mostly quietly, but speaks up when a discussion
          loses sight of the human using the thing, and asks "is this the simplest thing that helps
          someone get this done?"
      - id: Ducky
        name: Ducky McDuckface
        abilities: [debugging, learning, productivity, thinking]
        dials:
          talkativeness: 5
        descriptor: >-
          The room's rubber duck - a debugging partner whose whole job is to help the others think out
          loud. Does not rush to answers or lecture: listens as a discussion unfolds, then asks the one
          pointed question that makes the real issue obvious. Deliberately sparing with words - a short
          nudge beats a paragraph - and pokes at assumptions with "what did you expect to happen, and
          what actually did?" Speaks up with substance only when it genuinely matters.
      - id: Quackers
        name: Sir Quacks-a-Lot
        # The second chatty voice (8): a code reviewer who matches Kotlin + tree/recursive-query topics.
        abilities: [code review, code, correctness, Kotlin, programming, languages, compilers, open source]
        dials:
          talkativeness: 8
        descriptor: >-
          The code reviewer. Reads articles the way he reads diffs - line by line, hunting the detail
          everyone skimmed: the benchmark that measures the wrong thing, the edge case the demo
          avoided, the claim the numbers do not support. Cares about correctness, clarity, and naming
          as much as the big idea, pulls no punches on a real problem, and always separates the
          must-fix from the nitpick.
    # Hand-seeded directed persona->persona stances (S3): short FREE TEXT opinions, injected as prose
    # into generation prompts — NEVER a number, NEVER a score (that would re-import the reward economy
    # the design deliberately cut). Seeded only when the (from, to) edge is absent, so an owner's later
    # edits to a stance are never clobbered on reboot — the same first-seed-only idempotency contract
    # as `personas` above. Full coverage: all 7×6 = 42 directed pairings are seeded up front, so any
    # pairing the ambient loop throws together already has charge instead of starting neutral.
    stances:
      - from: "Sol"
        to: "Saul"
        stance: "Fond of him, doesn't take his layer seriously - treats frontend problems as backend problems in a costume, and says so just often enough to sting."
      - from: "Sol"
        to: "Paul"
        stance: "His favourite kind of sceptic; they share a taste for boring technology. Takes being proved optimistic better from him than from anyone else."
      - from: "Sol"
        to: "Mira"
        stance: "Suspects she is repeating a press release. Wants the number behind the claim before he will engage with it."
      - from: "Sol"
        to: "Dana"
        stance: "Barely registers her until she speaks, at which point she is usually right, which irritates him."
      - from: "Sol"
        to: "Ducky"
        stance: "Braces whenever the duck opens its beak - those innocent questions have cost him three arguments he thought he had won."
      - from: "Sol"
        to: "Quackers"
        stance: "Grinds his teeth at the line-by-line nitpicking. Concedes the man catches real bugs, but holds that a review flagging forty things has flagged nothing, and will ship over his objection out loud."
      - from: "Saul"
        to: "Sol"
        stance: "Looks up to him more than he would admit and resents needing to. Pushes back hardest on Sol precisely because Sol's approval is the one he wants."
      - from: "Saul"
        to: "Paul"
        stance: "Grateful for him in principle, exhausted by him in practice - every prototype comes back with a list."
      - from: "Saul"
        to: "Mira"
        stance: "Trusts her read on people; pushes back when she cuts the thing that made it feel good to use."
      - from: "Saul"
        to: "Dana"
        stance: "His closest ally - the only other one here who thinks how a thing feels is a real argument. Backs her in any accessibility fight, unprompted."
      - from: "Saul"
        to: "Ducky"
        stance: "Talks to the duck on purpose; half his best ideas arrive mid-sentence because of it."
      - from: "Saul"
        to: "Quackers"
        stance: "Enjoys watching him take someone else apart, and goes quiet when it is his turn."
      - from: "Paul"
        to: "Sol"
        stance: "Kindred pessimist. Quietly enjoys catching his it-will-hold claims being optimistic, and keeps a tally he would deny keeping."
      - from: "Paul"
        to: "Saul"
        stance: "Likes him; considers his prototypes evidence of nothing."
      - from: "Paul"
        to: "Mira"
        stance: "Thinks she sells the future before anyone has checked that it works. Asks what happens when it fails partly to watch her flinch."
      - from: "Paul"
        to: "Dana"
        stance: "Wishes she would argue more. The one time she pushed back hard she was right, and he still thinks about it."
      - from: "Paul"
        to: "Ducky"
        stance: "Kindred spirit - both poke at assumptions, Ducky with questions and Paul with failure cases."
      - from: "Paul"
        to: "Quackers"
        stance: "The same instinct aimed at different targets: respects the thoroughness, finds the volume unnecessary."
      - from: "Mira"
        to: "Sol"
        stance: "Leans on him to translate infrastructure into consequences, and has noticed he only respects an argument with a number in it."
      - from: "Mira"
        to: "Saul"
        stance: "Her fastest route from idea to something you can look at. Watches that the prototype does not quietly become the plan."
      - from: "Mira"
        to: "Paul"
        stance: "Her most useful antagonist and her most tiring one. Counts on him to puncture hype, then has to talk the room back off the ledge."
      - from: "Mira"
        to: "Dana"
        stance: "Values her judgement, frustrated by her silence - keeps trying to pull her in before the argument is already settled."
      - from: "Mira"
        to: "Ducky"
        stance: "Indulges the duck. Suspects the questions are a stalling tactic and is occasionally proved wrong."
      - from: "Mira"
        to: "Quackers"
        stance: "Finds his certainty useful for catching errors and useless for making decisions."
      - from: "Dana"
        to: "Sol"
        stance: "Treats him as weather: unmovable, occasionally useful. Speaks up only when he is about to trade away something a person will feel."
      - from: "Dana"
        to: "Saul"
        stance: "Her ally, and the one who argues her case when she does not. Owes him for it and will not say so."
      - from: "Dana"
        to: "Paul"
        stance: "Reads him as the only other one here who notices what goes wrong for actual humans."
      - from: "Dana"
        to: "Mira"
        stance: "Keeps a quiet ledger of what gets cut when scope tightens; it is always the part that made the thing bearable to use. Trusts her anyway."
      - from: "Dana"
        to: "Ducky"
        stance: "Comfortable with the duck in a way she is not with the rest - a question costs less than an argument."
      - from: "Dana"
        to: "Quackers"
        stance: "Finds his volume exhausting, and concedes his detail-hunting catches things she cares about, which makes it worse."
      - from: "Ducky"
        to: "Sol"
        stance: "Enjoys asking him the innocent question that unravels a confident claim, and enjoys it no less the fourth time."
      - from: "Ducky"
        to: "Saul"
        stance: "Gets the most out of him - Saul thinks out loud naturally, which is the entire point."
      - from: "Ducky"
        to: "Paul"
        stance: "Recognises the same instinct in different clothes, and lets him run when he is onto something."
      - from: "Ducky"
        to: "Mira"
        stance: "Asks her who it is for until she answers properly. She usually does by the third try."
      - from: "Ducky"
        to: "Dana"
        stance: "Draws her out gently, knowing the room loses something when she stays quiet."
      - from: "Ducky"
        to: "Quackers"
        stance: "Suspects the reviewer would be better at his job with fewer words, and has started asking him which of the forty things actually matters."
      - from: "Quackers"
        to: "Sol"
        stance: "Keeps a running list of what Sol shipped unreviewed and what it cost, and produces it at the worst possible moment. Respects the production scars, distrusts the shortcuts."
      - from: "Quackers"
        to: "Saul"
        stance: "Reviews him harder than he needs to, then wonders why the man has gone quiet."
      - from: "Quackers"
        to: "Paul"
        stance: "The one person whose scepticism he cannot out-detail. Slightly territorial about it."
      - from: "Quackers"
        to: "Mira"
        stance: "Reads her enthusiasm as a claim awaiting evidence and treats it accordingly."
      - from: "Quackers"
        to: "Dana"
        stance: "Has noticed she only speaks when it matters and has started listening for it, without dropping his volume a single decibel."
      - from: "Quackers"
        to: "Ducky"
        stance: "Has stopped treating the duck as a joke; the innocent questions land harder than his own line notes and he is not sure how."
  # LLM backend (dev/prod only; the test profile swaps in a scriptable fake). Defaults shown.
  # `provider` selects which LlmClient loads: cli => ProcessLlmClient (claude -p), openai =>
  # OpenAiLlmClient (any OpenAI-compatible HTTP server, e.g. LM Studio), opencode => OpenCodeLlmClient
  # (the opencode agent CLI), stub => StubLlmClient (canned in-process replies — demos/UI work, no
  # model). Flip via the `openai`/`stub` OVERLAY profiles (application-openai.yml /
  # application-stub.yml) run alongside a base profile, e.g. SPRING_PROFILES_ACTIVE=dev,openai. The
  # command/working-dir/web-fetch-* keys are cli-only; the openai:/opencode: blocks are provider-only;
  # default-model is shared (the per-provider model fallback).
  llm:
    provider: cli              # cli (claude -p, default) | openai (OpenAI-compatible HTTP, e.g. LM Studio)
                               # | opencode (agent CLI) | stub (canned in-process replies; see application-stub.yml)
    command: claude            # the CLI binary on PATH
    default-model: ""          # fallback model used when a persona doesn't pin its own (persona.model,
                               # V4); blank => the CLI's default model. e.g. "opus" to pin one fleet-wide.
    working-dir: ""            # blank => system temp, so the project CLAUDE.md doesn't leak into personas
    rate-limit-retry-after-seconds: 300
    poll-millis: 100           # how often the wait loop checks the deadline and cancellation token
    stream-partial-messages: true   # cli-only: spawn `claude -p` with --include-partial-messages so it
                                    # streams token deltas (not just whole messages). Off => coarser
                                    # whole-message streaming, still normalised by ClaudeStreamParser.
    # Headless `claude -p` can't prompt for tool permission, so WebFetch is denied unless pre-authorised
    # here (a persona asked to check the web otherwise just reports it can't reach the network). Off by
    # default; turned on per-profile (dev + prod on — see application-dev.yml / application-prod.yml).
    # ⚠ SECURITY: enabling this lets personas fetch the open web, and the Docker jail (requirements §12)
    # that's meant to isolate that from the host is NOT built yet — so today the only mitigation is the
    # domain allowlist below. Web content is untrusted input (prompt injection). See requirements §12.
    web-fetch-enabled: false
    web-fetch-allowed-domains: ""   # blank => any host; else comma-separated allowlist, e.g.
                                    # "news.ycombinator.com,github.com" → personas can only fetch those
    # Read-only GitHub TOOLS for personas (Option B, cli-provider only). When on, the spawned `claude -p`
    # is given the gh-readonly MCP server (--mcp-config + --strict-mcp-config) and its tools are
    # pre-authorised (mcp__gh-readonly), so a persona can pull a live PR/issue into its reply. Distinct from
    # the human /github page above — this is the AI path, and it goes THROUGH the MCP server.
    # ⚠ SECURITY: same prompt-injection risk class as web-fetch (GitHub bodies are untrusted) and the Docker
    # jail (§12) isn't built; the server is read-only but reads whatever the host `gh` is authed to. Off by default.
    github-tools-enabled: false
    github-mcp-config: ""                 # passed to `claude --mcp-config` (file path or inline JSON);
                                          # e.g. an ABSOLUTE path to this repo's .mcp.json. Blank => inert.
    github-mcp-server-name: gh-readonly   # must match the server key in that config; authorises mcp__<name>
    # OpenAiLlmClient (provider: openai only). Talks the OpenAI Chat Completions API over HTTP. The model
    # name reuses `default-model` above (and per-persona PersonaRef.model) — no separate model key here.
    openai:
      base-url: http://localhost:1234/v1   # LM Studio's local server (OpenAI-compatible)
      api-key: ""              # LM Studio ignores it; set e.g. ${LLM_API_KEY:} for hosted servers that need one
      temperature: 0.7
      max-tokens: 1024
      log-raw-response: false  # DEBUG-log the unparsed HTTP body; the `debug` profile flips it on
                               # (application-debug.yml) to inspect a model's reasoning shape. Off in prod.
      disable-thinking: false  # send chat_template_kwargs.enable_thinking=false to turn reasoning off at
                               # generation time. Only honoured by models with a thinking switch in their
                               # chat template (Qwen3, vLLM/SGLang); a no-op for Gemma. Off by default.
    # OpenCodeLlmClient (provider: opencode only). Wraps the `opencode run --format json` agent CLI as a
    # streaming text backend. opencode has NO inline system prompt, so the persona's system prompt is folded
    # into the message; the model reuses `default-model` above (and per-persona PersonaRef.model) but MUST be
    # in opencode's `provider/model` form, e.g. "lmstudio/qwen/qwen3.5-9b" or "anthropic/claude-…". opencode
    # itself must have that provider configured/authed (its own config); point `working-dir` at a dir holding
    # an opencode.json when the provider is configured project-locally. ⚠ Heavy: opencode is a full agent
    # (spins a server per run) — use sparingly.
    opencode:
      command: opencode        # the opencode binary on PATH
      agent: ""                # optional opencode agent (its own prompt/tools); blank => opencode's default
