server:
  # Bind to loopback only: this is a single-user local tool with no auth, so it must not be reachable
  # from the LAN. (T2.1 — turns the "binds 0.0.0.0 / no auth" Critical into a non-issue; full auth
  # stays deferred to T3.1.) Mirrors application-prod.yml; the test profile is left untouched (its
  # RANDOM_PORT / TestRestTemplate already use loopback).
  address: 127.0.0.1
  # Dev runs on 8020 so it doesn't collide with a prod instance (prod keeps the 8080 default — no
  # server.port override there). Change with `--server.port=` or SERVER_PORT if 8020 is also taken.
  port: 8020

spring:
  datasource:
    url: jdbc:sqlite:data/aiforum-dev.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
  # The dev DB is a throwaway, project-local file that gets migrated across many branches — so it
  # naturally accumulates Flyway checksum drift (e.g. a feature edits its own migration on its branch, or
  # two branches add migrations in different orders). Strict validation would then refuse to boot, which is
  # the recurring "can't test in a worktree" pain. Dev migrations still APPLY in order; we just skip the
  # pre-migrate checksum check here. Prod (persistent real data) and test (fresh DB) keep STRICT validation,
  # so a genuinely broken migration is still caught there — `./gradlew verifyAll` is the real gate.
  flyway:
    validate-on-migrate: false
  # Static assets (app.css, app.js, *.mjs) carry no fingerprint in their URLs, so a renamed CSS class
  # or changed script would otherwise be styled/run against a browser-cached copy until heuristic
  # freshness expires — e.g. all the delete-confirm panels falling open after .thread-row__delete-* was
  # renamed to .row-delete-*. no-cache forces the browser to revalidate every fetch; the existing
  # Last-Modified header then yields a cheap 304 when nothing changed and fresh bytes the instant it does.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

aiforum:
  backups:
    enabled: true
    # Throwaway project-local snapshots for dev (mirrors the dev DB + images living under data/), so a
    # `bootRun` dev session doesn't scatter snapshots into the real ~/.ai_forum/backup store.
    dir: data/backup-dev
  images:
    # Throwaway project-local image store for dev (mirrors the dev DB living under data/).
    dir: data/images-dev
  llm:
    # Dev dogfooding: let personas actually hit the web (e.g. "check HackerNews"). Leave the domain
    # allowlist blank for any host, or scope it (see application.yml) if you want to keep dev fetches tight.
    web-fetch-enabled: true
    # Read-only GitHub tools for personas (Option B): mount the in-repo gh-readonly MCP so a persona
    # reviewing a PR thread can pull the FULL pull request + diff (the opening post embeds only a truncated
    # excerpt — see PrThreadFormat). Inline MCP config so it's path-portable: ${user.dir} (the bootRun cwd =
    # repo root) is Spring-resolved, like ${user.home} elsewhere, so node gets an absolute path to the
    # server (its relative `import` resolves from the module file). Each tool takes an OWNER/REPO arg, so no
    # clone/cwd is needed. Needs `gh` authed + `node` on PATH. ⚠ SECURITY: PR content is untrusted input
    # (prompt injection) and the Docker jail (§12) isn't built — same risk class as web-fetch above.
    github-tools-enabled: true
    github-mcp-config: '{"mcpServers":{"gh-readonly":{"command":"node","args":["${user.dir}/mcp/gh-readonly/server.mjs"]}}}'
