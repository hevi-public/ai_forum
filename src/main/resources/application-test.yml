# Test profile: separate DB, single connection (SQLite serializes writes), backups OFF.
# These are asserted by ProfileGuard and by the config_guardrails.feature rail scenarios.
spring:
  datasource:
    url: jdbc:sqlite:build/aiforum-test.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

aiforum:
  backups:
    enabled: false
  images:
    # Image blobs go under build/ (like the test DB), asserted by ProfileGuard so a test run never writes
    # into the real ~/.ai_forum image store.
    dir: build/images-test
  # Shortcut integration ON under test so the acceptance suite can drive the rail box, the /shortcut page,
  # and inline sc-N links. The real HttpShortcutClient is @Profile("!test"); a @Primary ScriptableShortcutClient
  # (TestBeans) stands in and never does real IO. It's INACTIVE by default (isActive=false), so the surfaces
  # stay dark in scenarios that don't opt in; a step flips it on. workspace-slug pins the inline-link host.
  shortcut:
    enabled: true
    workspace-slug: test-workspace
    default-query: is:started
    recent-query: "updated:-2w..*"
    owner-mention-name: owner
