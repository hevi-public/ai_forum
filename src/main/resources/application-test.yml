# Test profile: separate DB, single connection (SQLite serializes writes), backups OFF.
# These are asserted by ProfileGuard and by the config_guardrails.feature rail scenarios.
spring:
  datasource:
    url: jdbc:sqlite:build/aiforum-test.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

aiforum:
  backups:
    enabled: false
  # Ambient ticking OFF under test (defence-in-depth, matching backups): the scheduler never wires, so a
  # test run can't fire an autonomous tick. The /admin trigger still works — acceptance drives it over
  # HTTP — and the ScriptableArticleSource (@Primary under test) keeps every tick deterministic and free.
  # The config_guardrails rail asserts this from the outside (/__diag ambientEnabled=false).
  ambient:
    enabled: false
  # Stance evolution OFF under test for the same reason (plan_docs/ambient-slice-4a.md D12): it is the
  # second thing in this app that spends LLM calls on a schedule, so its scheduler must be unable to fire
  # during a run. Redundant with the shipped default, and stated anyway — a rail asserts a value, and a
  # value that exists only as a Kotlin default is one refactor away from silently becoming true. The
  # /admin/stances trigger still works (acceptance drives it over HTTP); the config_guardrails rail
  # asserts this from the outside (/__diag stanceEvolutionEnabled=false).
  stance-evolution:
    enabled: false
  images:
    # Image blobs go under build/ (like the test DB), asserted by ProfileGuard so a test run never writes
    # into the real ~/.ai_forum image store.
    dir: build/images-test
  # Shortcut integration ON under test so the acceptance suite can drive the rail box, the /shortcut page,
  # and inline sc-N links. The real HttpShortcutClient is @Profile("!test"); a @Primary ScriptableShortcutClient
  # (TestBeans) stands in and never does real IO. It's INACTIVE by default (isActive=false), so the surfaces
  # stay dark in scenarios that don't opt in; a step flips it on. workspace-slug pins the inline-link host.
  shortcut:
    enabled: true
    workspace-slug: test-workspace
    default-query: is:started
    recent-query: "updated:-2w..*"
    owner-mention-name: owner
